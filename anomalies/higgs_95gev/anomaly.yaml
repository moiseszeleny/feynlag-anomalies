status: hint
status_date: 2026-10-15
status_rationale: >
  Three channels show deviations of 2 to 3 sigma at similar masses, and none is significant alone.
  CMS diphoton sees 2.9 sigma local (1.3 sigma global) at 95.4 GeV. CMS ditau sees 2.6 sigma local
  (2.3 sigma global) at 95 GeV and 3.1 sigma local at 100 GeV. LEP bb-bar sees 2.3 sigma near 98
  GeV. ATLAS finds only 1.7 sigma at 95.4 GeV in its full Run 2 diphoton search, with no
  significant excess. A reanalysis of the LEP data disfavours a 95 GeV scalar as the source of the
  bb-bar excess. A search through 2026-10-15 found no Run 3 or 2026 collaboration result on this
  excess. Status stays hint, not live.

tensions_with_other_data:
  - "ATLAS vs. CMS diphoton: ATLAS (arXiv:2407.07546, 140 fb^-1) sees 1.7 sigma local at 95.4 GeV and reports no significant excess, against 2.9 sigma local (1.3 sigma global) in CMS (arXiv:2405.18149). The ATLAS excess sits at the same mass but is weaker."
  - "LEP bb-bar: Janot (arXiv:2407.10948) finds the LEP data strongly disfavour a 95 GeV scalar as the cause of the bb-bar excess, and any other new-physics interpretation in the 95 to 100 GeV mass range (abstract of the paper). This reanalysis is a single-author paper, not a LEP collaboration result."
  - "Mass: the CMS ditau excess is largest at 100 GeV (3.1 sigma local), not at 95 GeV (2.6 sigma local), and the LEP bb-bar minimum is at about 98 GeV. CMS itself notes the ditau excess coincides, within mass resolution, with the diphoton one."

sm_failure_type: resonance
sm_protection:
  - field_content

eft_operators: []
candidate_models: []

maturity: A1

falsifiers:
  - "A Run 3 CMS or ATLAS low-mass diphoton search at 13.6 TeV that rules out the CMS 95.4 GeV signal."
  - "A larger-statistics CMS or ATLAS ditau search showing no gg -> phi excess at 95 to 100 GeV."

