sources:
  - kind: arxiv
    identifier: "arXiv:2410.05380v2 (NuFIT 6.0; JHEP 12 (2024) 216; INSPIRE 2838825), Table 1, IC24 with SK atmospheric data, Normal Ordering"
    consulted_on: 2026-09-25

status: established
status_date: 2026-09-25
status_rationale: >
  Neutrino oscillations, and hence nonzero neutrino mass, are a well-established result confirmed
  by multiple independent experiments (solar, atmospheric, reactor, accelerator). Anchored here
  to the NuFIT 6.0 global fit (arXiv:2410.05380v2, Table 1): both mass splittings are measured
  with percent-level 1-sigma errors, i.e. far from zero.

tensions_with_other_data:
  - "TODO_VERIFY: interaction with cosmological Sigma m_nu bounds (Planck / DESI) and with
    0-neutrinoless-double-beta-decay limits on the effective Majorana mass -- not yet checked
    against a primary source."

sm_failure_type: structural
sm_protection:
  - field_content
  - accidental_symmetry

eft_operators:
  - name: "Weinberg operator"
    dimension: 5
    expression: "(L H)(L H) / Lambda"

candidate_models:
  - model_id: seesaw_type1
    notes: >
      Single generation, one nu_R: a single massive light neutrino (rank-1 light sector). Used in
      steps 3-5 of the ladder; cannot fit two independent Delta m^2.
  - model_id: seesaw_type1_2n
    notes: >
      Three generations, two nu_R (feynlag-models PR #9, maturity L2), built from
      model_requests/seesaw_type1_nN.md. Rank-2 light sector: m1 = 0 plus two massive states.
      Step-6 fit: chi2_min ~ 0 against NuFIT 6.0 (NO) with ndof = -1 (see decisions.md).

maturity: A3

falsifiers:
  - "Discovery of a renormalizable, dimension<=4 SM-only mechanism generating neutrino mass
    without new fields would contradict the step-1 structural test -- not expected, listed as
    a sanity falsifier for the A1 claim itself."

changelog:
