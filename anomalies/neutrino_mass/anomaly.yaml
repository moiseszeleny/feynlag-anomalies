    note: >
      A0-A2 record created: schema populated (all measured observables TODO_VERIFY, no literature
      search performed this session); step 1 structural SM test (no dim<=4 neutrino-mass term)
      and step 2 Weinberg-operator enumeration implemented and passing; step 3-4 import
      feynlag-models' seesaw_type1 bundle; step 5 files model_requests/seesaw_type1_nN.md
