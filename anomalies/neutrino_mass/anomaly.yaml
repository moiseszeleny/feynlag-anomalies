id: neutrino_mass
title: "Neutrino mass and oscillations"
sector: neutrinos

# NuFIT 6.0, arXiv:2410.05380v2 (28 Oct 2025), Table 1, variant "IC24 with SK atmospheric data"
# (the paper's comprehensive analysis), Normal Ordering column (the global best fit in this
# variant). Values are the printed best-fit points. NuFIT prints asymmetric total 1-sigma errors
# (+up/-down, in the comments); stat_uncertainty holds their mean, a stage-1 symmetrisation, and
# sys_uncertainty is null because NuFIT gives no stat/sys split. See decisions.md, step 6.
observables:
  - name: "Delta m^2_21 (solar)"
    value: 7.49e-5                # 7.49 +0.19 -0.19 [1e-5 eV^2]
    stat_uncertainty: 0.19e-5
    sys_uncertainty: null
    units: "eV^2"
  - name: "Delta m^2_31 (atmospheric, normal ordering)"
    value: 2.513e-3               # Delta m^2_3l = Delta m^2_31 for NO: +2.513 +0.021 -0.019 [1e-3 eV^2]
    stat_uncertainty: 0.020e-3
    sys_uncertainty: null
    units: "eV^2"
  - name: "theta_12"
    value: 33.68                  # +0.73 -0.70
    stat_uncertainty: 0.715
    sys_uncertainty: null
    units: "degrees"
  - name: "theta_13"
    value: 8.56                   # +0.11 -0.11
    stat_uncertainty: 0.11
    sys_uncertainty: null
    units: "degrees"
  - name: "theta_23"
    value: 43.3                   # +1.0 -0.8
    stat_uncertainty: 0.9
    sys_uncertainty: null
    units: "degrees"
  - name: "delta_CP"
    value: 212.0                  # +26 -41; recorded, not fitted (the model's Yukawas are real)
    stat_uncertainty: 33.5
    sys_uncertainty: null
    units: "degrees"

sm_prediction:
  value: 0.0
  uncertainty: 0.0
  provenance: computed
  reference: "anomalies/neutrino_mass/tests/test_sm_structural.py::test_no_dim4_neutrino_mass_term (step 1: feynlag.suggest.suggest_yukawa on minimal SM leptons, no nu_R, returns exactly the charged-lepton Yukawa at max_dim=4)"

experiments:
  # Roles as attributed by NuFIT 6.0 (arXiv:2410.05380v2, Sec. 1 and App. A), consulted 2026-09-26.
  - name: "Super-Kamiokande"
    notes: "Solar (SK1-4, incl. SK-IV day-night spectrum): theta_12, Delta m^2_21. Atmospheric (SK1-5, chi^2 map): theta_23, |Delta m^2_3l|, mass ordering."
  - name: "SNO"
    notes: "Solar: theta_12, Delta m^2_21."
  - name: "KamLAND"
    notes: "Reactor (long baseline): theta_12, Delta m^2_21."
  - name: "Daya Bay"
    notes: "Reactor (short baseline): theta_13, |Delta m^2_3l|."
  - name: "T2K"
    notes: "Accelerator long-baseline: theta_23, delta_CP, mass ordering, |Delta m^2_3l|."
  - name: "NOvA"
    notes: "Accelerator long-baseline: theta_23, delta_CP, mass ordering, |Delta m^2_3l|."
  - name: "IceCube/DeepCore"
    notes: "Atmospheric (IC19, IC24; the 'IC24' variant fitted here): theta_23, |Delta m^2_3l|, mass ordering."

sources:
  - kind: arxiv
    identifier: "arXiv:2410.05380v2 (NuFIT 6.0; JHEP 12 (2024) 216; INSPIRE 2838825), Table 1, IC24 with SK atmospheric data, Normal Ordering"
    consulted_on: 2026-09-25
  - kind: arxiv
    identifier: "arXiv:2503.14738v3 (DESI Collaboration, DESI DR2 Results II: BAO and cosmological constraints), abstract"
    consulted_on: 2026-09-26
  - kind: arxiv
    identifier: "arXiv:2606.17994v1 (Hou, Wang, Zhao, Zhang, Sum of neutrino masses from ACT DR6 and DESI DR2 with isocurvature), abstract"
    consulted_on: 2026-09-26
  - kind: arxiv
    identifier: "arXiv:2406.11438v2 (KamLAND-Zen, Search for Majorana neutrinos with the complete KamLAND-Zen dataset), Eq. 2"
    consulted_on: 2026-09-26
  - kind: arxiv
    identifier: "arXiv:2406.13516v1 (KATRIN, Direct neutrino-mass measurement based on 259 days of KATRIN data), abstract"
    consulted_on: 2026-09-26

status: established
status_date: 2026-09-25
status_rationale: >
  Neutrino oscillations, and hence nonzero neutrino mass, are a well-established result confirmed
  by multiple independent experiments (solar, atmospheric, reactor, accelerator). Anchored here
  to the NuFIT 6.0 global fit (arXiv:2410.05380v2, Table 1): both mass splittings are measured
  with percent-level 1-sigma errors, i.e. far from zero.

tensions_with_other_data:
  - "Cosmology vs. the normal-ordering minimum: DESI DR2 + CMB give sum m_nu < 0.064 eV (95%, LambdaCDM; arXiv:2503.14738v3), only just above the minimum allowed by the oscillation splittings in normal ordering. A 2026 combination (Planck 2018 + ACT DR6 + SPT-3G + DESI DR2 + DES Y5; arXiv:2606.17994v1) finds < 0.052 eV (95%, adiabatic LambdaCDM), below that minimum; its authors attribute this to the statistical prior extending to zero, and quote < 0.092 eV with a hierarchy-informed prior. The bounds are model dependent (DESI: < 0.16 eV in w0wa). See constraints[] and ladder step 7."
  - "0nubetabeta and beta decay: KamLAND-Zen (m_betabeta < 28-122 meV, 90% CL; arXiv:2406.11438v2) and KATRIN (m_nu < 0.45 eV, 90% CL; arXiv:2406.13516v1) do not yet reach the normal-ordering region with a massless lightest neutrino (ladder step 7, computed)."

constraints:
  - name: "Sum of neutrino masses, DESI DR2 + CMB, LambdaCDM"
    quantity: sum_m_nu
    upper_limit: 0.064
    confidence_level: 0.95
    units: "eV"
    source: "arXiv:2503.14738v3 (DESI Collaboration, DESI DR2 Results II: BAO and cosmological constraints), abstract"
  - name: "Sum of neutrino masses, DESI DR2 + CMB, w0wa"
    quantity: sum_m_nu
    upper_limit: 0.16
    confidence_level: 0.95
    units: "eV"
    source: "arXiv:2503.14738v3 (DESI Collaboration, DESI DR2 Results II: BAO and cosmological constraints), abstract"
  - name: "Sum of neutrino masses, CMB-SPA + DESI DR2 + DES Y5, adiabatic LambdaCDM"
    quantity: sum_m_nu
    upper_limit: 0.052
    confidence_level: 0.95
    units: "eV"
    source: "arXiv:2606.17994v1 (Hou, Wang, Zhao, Zhang, Sum of neutrino masses from ACT DR6 and DESI DR2 with isocurvature), abstract"
    notes: "Not a collaboration result. Below the normal-ordering minimum; the authors attribute this to the prior extending to zero (hierarchy-informed prior: < 0.092 eV). Recorded as a tension, not as the anchor bound."
  - name: "Effective Majorana mass, KamLAND-Zen 800 (136Xe)"
    quantity: m_betabeta
    upper_limit: 0.122
    upper_limit_strongest: 0.028
    confidence_level: 0.90
    units: "eV"
    source: "arXiv:2406.11438v2 (KamLAND-Zen, Search for Majorana neutrinos with the complete KamLAND-Zen dataset), Eq. 2"
    notes: "Range from nuclear matrix elements (T_1/2 > 3.8e26 yr); the conservative end is used for the cut."
  - name: "Effective electron-neutrino mass, KATRIN (259 days)"
    quantity: m_beta
    upper_limit: 0.45
    confidence_level: 0.90
    units: "eV"
    source: "arXiv:2406.13516v1 (KATRIN, Direct neutrino-mass measurement based on 259 days of KATRIN data), abstract"

sm_failure_type: structural
sm_protection:
  - field_content
  - accidental_symmetry

eft_operators:
  - name: "Weinberg operator"
    dimension: 5
    expression: "(L H)(L H) / Lambda"

candidate_models:
  - model_id: seesaw_type1
    notes: >
      Single generation, one nu_R: a single massive light neutrino (rank-1 light sector). Used in
      steps 3-5 of the ladder; cannot fit two independent Delta m^2.
  - model_id: seesaw_type1_2n
    notes: >
      Three generations, two nu_R (feynlag-models PR #9, maturity L2), built from
      model_requests/seesaw_type1_nN.md. Rank-2 light sector: m1 = 0 plus two massive states.
      Step-6 fit: chi2_min ~ 0 against NuFIT 6.0 (NO) with ndof = -1 (see decisions.md).

maturity: A3

falsifiers:
  - "Discovery of a renormalizable, dimension<=4 SM-only mechanism generating neutrino mass
    without new fields would contradict the step-1 structural test -- not expected, listed as
    a sanity falsifier for the A1 claim itself."
  - "seesaw_type1_2n (normal ordering) predicts m_1 = 0, i.e. the minimum sum m_nu allowed by the splittings. A robust cosmological bound below that minimum (one not driven by a prior extending to zero) would exclude it."
  - "With real Yukawas, seesaw_type1_2n's light matrix is negative semidefinite, so m_betabeta takes the single constructive value |m2 s12^2 c13^2 + m3 s13^2| (ladder step 7, computed). A 0nubetabeta measurement of any other m_betabeta would exclude the real-Yukawa model (complex Yukawas would open the range down to the destructive branch)."

