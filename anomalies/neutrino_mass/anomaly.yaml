id: neutrino_mass
title: "Neutrino mass and oscillations"
sector: neutrinos

# NuFIT 6.0, arXiv:2410.05380v2 (28 Oct 2025), Table 1, variant "IC24 with SK atmospheric data"
# (the paper's comprehensive analysis), Normal Ordering column (the global best fit in this
# variant). Values are the printed best-fit points. NuFIT prints asymmetric total 1-sigma errors
# (+up/-down, in the comments); stat_uncertainty holds their mean, a stage-1 symmetrisation, and
# sys_uncertainty is null because NuFIT gives no stat/sys split. See decisions.md, step 6.
observables:
  - name: "Delta m^2_21 (solar)"
    value: 7.49e-5                # 7.49 +0.19 -0.19 [1e-5 eV^2]
    stat_uncertainty: 0.19e-5
    sys_uncertainty: null
    units: "eV^2"
  - name: "Delta m^2_31 (atmospheric, normal ordering)"
    value: 2.513e-3               # Delta m^2_3l = Delta m^2_31 for NO: +2.513 +0.021 -0.019 [1e-3 eV^2]
    stat_uncertainty: 0.020e-3
    sys_uncertainty: null
    units: "eV^2"
  - name: "theta_12"
    value: 33.68                  # +0.73 -0.70
    stat_uncertainty: 0.715
    sys_uncertainty: null
    units: "degrees"
  - name: "theta_13"
    value: 8.56                   # +0.11 -0.11
    stat_uncertainty: 0.11
    sys_uncertainty: null
    units: "degrees"
  - name: "theta_23"
    value: 43.3                   # +1.0 -0.8
    stat_uncertainty: 0.9
    sys_uncertainty: null
    units: "degrees"
  - name: "delta_CP"
    value: 212.0                  # +26 -41; recorded, not fitted (the model's Yukawas are real)
    stat_uncertainty: 33.5
    sys_uncertainty: null
    units: "degrees"

