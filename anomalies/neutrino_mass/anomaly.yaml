    note: >
      Observables sourced from NuFIT 6.0 (arXiv:2410.05380v2, Table 1, IC24 with SK-atm, NO);
      status_date set. Step 6 run: stage-1 chi2 of feynlag-models' seesaw_type1_2n over
      Delta m^2_21, Delta m^2_31, theta_12, theta_13, theta_23 (delta_CP recorded, not fitted:
      real Yukawas). chi2_min ~ 3e-14 with ndof = -1 (the model accommodates the data; not a
