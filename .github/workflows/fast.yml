# NOTE: currently blocked by docs/upstream_gaps.md UG-1 (feynlag-models' git dependency ships no
# model data files) -- the "uv run pytest -q" step below will fail on any model-touching test
# until that packaging gap is fixed upstream. Left as-is (not worked around) since the only
# available workaround needs a local sibling checkout, which CI runners don't have.
name: fast

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - run: uv run pytest -q -m "not slow"
      - run: uv run pytest --nbmake anomalies -q
