id: flavor_puzzle
title: "The flavor puzzle: hierarchical masses and mixings"
statement: >
  The SM gauge sector has a U(3)^5 flavor symmetry that only the Yukawa couplings break, and
  nothing in the SM fixes their values. The nine charged-fermion Yukawa eigenvalues spread over
  about six orders of magnitude. The CKM matrix is close to the identity, with a hierarchy in
  powers of the Cabibbo angle, while lepton mixing has large angles. The SM fits all of this with
  free parameters but explains none of it.

# Running masses: Huang & Zhou, arXiv:2009.04851v2 (PRD 103, 016010), Table 2 (quarks) and
# Table 3 (charged leptons), row "M_Z, Full SM" (MS-bar, six quarks and three leptons active).
# Above the EW scale they define m_f = y_f v_F / sqrt(2) with v_F = 246 GeV, the same relation
# as sm_ckm's y_f = sqrt(2) m_f / v; the Yukawas are derived from these by code (solutions/step_1).
# Uncertainties are their quoted total (experimental and truncation errors combined).
#
# CKM: PDG 2024 CKM review (rpp2024-rev-ckm-matrix, 31 May 2024), Eq. (12.28), the global-fit
# standard-parametrization angles, which are sm_ckm's own inputs (s12, s13, s23, deltaCP).
# Asymmetric errors are stored as the mean of +/- (a stage-1 symmetrisation, as in
# anomalies/neutrino_mass); the printed values are in the comments.
sm_quantities:
  - {name: "m_u(M_Z)", value: 1.23e-3, uncertainty: 0.21e-3, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_c(M_Z)", value: 0.620, uncertainty: 0.017, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_t(M_Z)", value: 168.26, uncertainty: 0.75, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_d(M_Z)", value: 2.67e-3, uncertainty: 0.19e-3, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_s(M_Z)", value: 53.16e-3, uncertainty: 4.61e-3, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_b(M_Z)", value: 2.839, uncertainty: 0.026, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_e(M_Z)", value: 0.48307e-3, uncertainty: 0.00045e-3, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_mu(M_Z)", value: 0.101766, uncertainty: 0.000023, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  - {name: "m_tau(M_Z)", value: 1.72856, uncertainty: 0.00028, units: "GeV", scale: "MS-bar, mu = M_Z, full SM", source: "arXiv:2009.04851"}
  # v_F is a definition of the source (v_F = 246 GeV, about (sqrt(2) G_F)^(-1/2)), not a measurement.
  - {name: "v_F", value: 246.0, uncertainty: null, units: "GeV", source: "arXiv:2009.04851"}
  - {name: "sin theta_12", value: 0.22501, uncertainty: 0.00068, units: "1", source: "PDG2024:rev-ckm-matrix"}
  - {name: "sin theta_13", value: 0.003732, uncertainty: 0.0000875, units: "1", source: "PDG2024:rev-ckm-matrix"}   # 0.003732 +0.000090 -0.000085
  - {name: "sin theta_23", value: 0.04183, uncertainty: 0.00074, units: "1", source: "PDG2024:rev-ckm-matrix"}       # 0.04183 +0.00079 -0.00069
  - {name: "delta", value: 1.147, uncertainty: 0.026, units: "rad", source: "PDG2024:rev-ckm-matrix"}

quantifier:
  name: "free_parameter_log10_span"
  definition: >
    log10(max |c| / min |c|) over the dimensionless free parameters c that a theory needs to
    reproduce the charged-fermion masses and the CKM matrix. In the SM the c are the nine Yukawa
    eigenvalues and the three CKM mixing sines (the phase delta is left out: it is an angle with
    no hierarchy content). In a flavor model they are the model's own
    coefficients (e.g. the O(1) prefactors of Froggatt-Nielsen powers). A model addresses the
    puzzle to the extent that it lowers this span while still fitting the data.
    Froggatt-Nielsen case (amended 2026-10-08, decisions.md): only the O(1) coefficients |c_ij|
    count. The order parameter eps and the integer U(1)_FN charges are not c's: eps is a free fit
    parameter that produces the hierarchy, and the charges are discrete model choices. Span rule:
    the minimum of log10(max |c| / min |c|) over the c's, subject to chi2 <= chi2_min + Delta,
    counting only the c's that some observable constrains (Delta and that set are fixed in the P3
    design). P3 is quark-only, so its comparison value is sm_reference_values.quarks_only (six
    quark Yukawas and three CKM sines), not the all-sector sm_value.
  implementation: "puzzles.flavor_puzzle.solutions.step_1:free_parameter_log10_span"
  provenance: computed
  sm_value: 5.542   # all sectors, log10(y_t / y_e); checked against the code by tests/test_step1_yukawas.py
  sm_reference_values:
    quarks_only: 5.136   # log10(y_t / y_u); test_quark_only_sm_value_matches_yaml

missing_protection:
  - no_flavor_organizing_symmetry

mechanism_classes:
  - symmetry   # e.g. Froggatt-Nielsen U(1), non-abelian or modular flavor symmetries
  - dynamics   # e.g. partial compositeness, wavefunction localization in extra dimensions

sources:
  - {kind: arxiv, identifier: "arXiv:2009.04851", consulted_on: 2026-10-04}
  - {kind: pdg, identifier: "PDG2024:rev-ckm-matrix", consulted_on: 2026-10-04}
  # NA62, JHEP 06 (2021) 093: BR(K+ -> pi+ X) < 3-6e-11 at 90% CL for a stable or invisible X with
  # m_X = 0-110 MeV (text of Sec. 8 and the conclusions). Input to the P3 familon constraint on
  # v_phi; the translation to a v_phi bound is not done yet (TODO_VERIFY, see decisions.md).
  - {kind: arxiv, identifier: "arXiv:2103.15389", consulted_on: 2026-10-08}

status: open
status_date: 2026-10-04
status_rationale: >
  No mechanism for the Yukawa hierarchies is established, and none is singled out by data. This
  is a judgment about the theoretical state of the field, not a measured quantity. It should be
  re-checked against recent flavor-model reviews in the P0 literature pass.

related_anomalies:
  - neutrino_mass   # lepton mixing with large angles is the lepton side of the puzzle

eft_operators: []
candidate_models:
  - model_id: froggatt_nielsen
    model_request: model_requests/froggatt_nielsen.md
    notes: "U(1)_FN flavon; Yukawas y_ij = c_ij eps^n_ij with O(1) complex c_ij (feynlag-models
      PR #14, maturity L2), built from model_requests/froggatt_nielsen.md. Integer FN charges are
      benchmark inputs (LNS master model at the benchmark); P3 fits (eps, c_ij), quarks only.
      Build with v = v_F = 246 GeV (the model default is 246.22 GeV), as sm_benchmark does.
      P3 hard constraint, listed and not part of the stage-1 chi2: the flavon phase a is an
      exact Goldstone (familon) with off-diagonal couplings n_ij M_ij / v_phi, bounded by
      K+ -> pi+ a (NA62, arXiv:2103.15389). The v_phi bound itself is TODO_VERIFY, and the
      benchmark v_phi = 2.83 TeV must not be quoted as viable."
# No eft_operators entry: the Froggatt-Nielsen operators have dimension 4 + n_ij, set by
# charges that are benchmark inputs of the model, not fixed here.

maturity: P2

falsifiers: []

